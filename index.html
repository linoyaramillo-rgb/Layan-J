<script>
const API_URL = 'https://layan-j-chat.linoyaramillo.workers.dev/';

const form = document.getElementById('chatForm');
const input = document.getElementById('userMessage');
const messages = document.getElementById('messages');

const history = [];

function addMessage(text, className = 'message') {
  const element = document.createElement('div');
  element.className = className;
  element.textContent = text;
  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
  return element;
}

form.addEventListener('submit', async function(event) {
  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  addMessage(text);
  input.value = '';
  input.disabled = true;

  const sendButton = form.querySelector('button');
  if (sendButton) sendButton.disabled = true;

  const loading = addMessage('One moment, darling…', 'message');

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: text,
        history: history
      })
    });

    const data = await response.json();

    loading.remove();

    if (!response.ok) {
      const details = data.details || data.error || 'Unknown error';
      addMessage(
        'Sorry, darling. The connection failed. ' +
        'Details: ' + details
      );
      return;
    }

    if (!data.reply) {
      addMessage('Sorry, darling. The AI returned an empty reply.');
      return;
    }

    addMessage(data.reply);

    history.push(
      { role: 'user', text: text },
      { role: 'model', text: data.reply }
    );

    if (history.length > 12) {
      history.splice(0, history.length - 12);
    }

  } catch (error) {
    loading.remove();

    addMessage(
      'Connection error: ' +
      (error.message || 'Unable to reach the AI service.')
    );

  } finally {
    input.disabled = false;

    if (sendButton) sendButton.disabled = false;

    input.focus();
  }
});
</script>
